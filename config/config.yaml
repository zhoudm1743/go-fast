# ── 服务器 ──────────────────────────────────────
server:
  name: GoFast
  driver: gin              # fiber / gin
  host: 0.0.0.0
  port: 3000
  mode: debug                # debug / release
  read_timeout_sec: 30
  write_timeout_sec: 30
  idle_timeout_sec: 120
  shutdown_timeout_sec: 10
  prefork: false
  body_limit_mb: 10
  cors_allow_origins:
    - "*"

# ── JWT ──────────────────────────────────────────
jwt:
  secret: "change-me-to-a-random-secret"
  ttl: 60                      # 分钟
  alg: HS256                   # HS256 / HS384 / HS512
  # guards:                    # 命名 Guard（可选），每个 Guard 独立配置
  #   platform:
  #     secret: "platform-guard-secret"
  #     ttl: 120
  #     alg: HS512

# ── HTML 模板渲染 ────────────────────────────────
# 留空或不配置 dir 则禁用视图引擎（纯 API 项目可不配置）。
# 嵌入打包场景请不要配置此项，改在自定义 ServiceProvider 中使用 view.WithFS。
view:
  dir: resources/views       # 模板根目录（相对于项目根）
  extension: .html           # 文件扩展名过滤，空字符串表示加载全部
  reload: true               # true=开发热重载；生产环境改为 false

# ── Session ─────────────────────────────────────
session:
  lifetime: 7200             # 会话有效期（秒），默认 2 小时
  cookie: go_fast_session    # 保存 Session ID 的 Cookie 名称

# ── 数据库 ──────────────────────────────────────
database:
  default: main
  connections:
    main:
      driver: gormdriver       # gormdriver（GORM 实现）
      engine: sqlite           # sqlite / mysql / postgres / mssql
      database: database/gofast.db
      max_idle_conns: 10
      max_open_conns: 100
      conn_max_lifetime: 60    # 分钟
      conn_max_idle_time: 30   # 分钟
      log_level: info          # silent / error / warn / info
      slow_threshold: 200      # 慢查询阈值（毫秒），0 表示不记录

# ── 队列 ────────────────────────────────────────
queue:
  workers: 0                   # 0 表示 runtime.NumCPU()

# ── 示例服务（services/test）────────────────────
test:
  greeting_prefix: Hello

# ── 日志 ────────────────────────────────────────
log:
  mode: hybrid               # console | file | hybrid（默认 hybrid，控制台+文件）
  level: debug               # debug / info / warn / error / fatal / panic
  format: color              # 控制台格式：color / json / text
  file_format: json          # 文件格式：json / text
  output_path: storage/logs/app.log   # mode=file 或 hybrid 时生效
  timestamp_format: "2006-01-02 15:04:05"  # 时间戳格式
  max_size: 100              # MB
  max_backups: 5
  max_age: 30                # 天
  compress: false

# ── 文件系统 ────────────────────────────────────
filesystem:
  default: local
  disks:
    local:
      driver: local
      root: storage/app
      url: /storage

# ── 缓存 ────────────────────────────────────────
cache:
  driver: file               # memory / file / redis
  memory:
    shard_count: 32
    clean_interval: 60       # 秒
  file:
    path: storage/cache      # 缓存目录（相对于项目根）
    clean_interval: 600      # 过期文件清理间隔（秒）
  # redis:                   # driver=redis 时取消注释
  #   host: 127.0.0.1
  #   port: 6379
  #   password: ""
  #   db: 0
  #   prefix: ""


