# ── 服务器 ──────────────────────────────────────
server:
  name: GoFast
  driver: gin              # fiber / gin
  host: 0.0.0.0
  port: 3000
  mode: debug                # debug / release
  read_timeout_sec: 30
  write_timeout_sec: 30
  idle_timeout_sec: 120
  shutdown_timeout_sec: 10
  prefork: false
  body_limit_mb: 10
  cors_allow_origins:
    - "*"

# ── JWT ──────────────────────────────────────────
jwt:
  secret: "change-me-to-a-random-secret"
  ttl: 60                      # 分钟
  alg: HS256                   # HS256 / HS384 / HS512
  # guards:                    # 命名 Guard（可选），每个 Guard 独立配置
  #   platform:
  #     secret: "platform-guard-secret"
  #     ttl: 120
  #     alg: HS512

# ── HTML 模板渲染 ────────────────────────────────
# 留空或不配置 dir 则禁用视图引擎（纯 API 项目可不配置）。
# 嵌入打包场景请不要配置此项，改在自定义 ServiceProvider 中使用 view.WithFS。
view:
  dir: resources/views       # 模板根目录（相对于项目根）
  extension: .html           # 文件扩展名过滤，空字符串表示加载全部
  reload: true               # true=开发热重载；生产环境改为 false

# ── Session ─────────────────────────────────────
session:
  lifetime: 7200             # 会话有效期（秒），默认 2 小时
  cookie: go_fast_session    # 保存 Session ID 的 Cookie 名称

# ── 数据库 ──────────────────────────────────────
database:
  default: main
  connections:
    main:
      driver: gormdriver       # gormdriver（GORM 实现）
      engine: sqlite           # sqlite / mysql / postgres / mssql
      database: database/gofast.db
      max_idle_conns: 10
      max_open_conns: 100
      conn_max_lifetime: 60    # 分钟
      conn_max_idle_time: 30   # 分钟
      log_level: info          # silent / error / warn / info
      slow_threshold: 200      # 慢查询阈值（毫秒），0 表示不记录

# ── 队列 ────────────────────────────────────────
queue:
  workers: 0                   # 0 表示 runtime.NumCPU()

# ── 示例服务（services/test）────────────────────
test:
  greeting_prefix: Hello

# ── 日志 ────────────────────────────────────────
log:
  mode: hybrid               # console | file | hybrid（默认 hybrid，控制台+文件）
  level: debug               # debug / info / warn / error / fatal / panic
  format: color              # 控制台格式：color / json / text
  file_format: json          # 文件格式：json / text
  output_path: storage/logs/app.log   # mode=file 或 hybrid 时生效
  timestamp_format: "2006-01-02 15:04:05"  # 时间戳格式
  max_size: 100              # MB
  max_backups: 5
  max_age: 30                # 天
  compress: false

# ── 文件系统 ────────────────────────────────────
filesystem:
  default: local
  disks:
    local:
      driver: local
      root: storage/app
      url: /storage

# ── 缓存 ────────────────────────────────────────
cache:
  driver: file               # memory / file / redis
  memory:
    shard_count: 32
    clean_interval: 60       # 秒
  file:
    path: storage/cache      # 缓存目录（相对于项目根）
    clean_interval: 600      # 过期文件清理间隔（秒）
  # redis:                   # driver=redis 时取消注释
  #   host: 127.0.0.1
  #   port: 6379
  #   password: ""
  #   db: 0
  #   prefix: ""

# ── gRPC ────────────────────────────────────────
# 默认全部关闭；启用需同时在 bootstrap/providers 中注册 grpc.ServiceProvider。
# 服务注册示例（生成代码）：
#   pb.RegisterUserServiceServer(facades.Grpc().Server().Server(), svc)
grpc:
  server:
    enabled: false           # 默认关闭，HTTP 仍是默认入口
    host: 0.0.0.0            # 注册发现场景请改为本机可被发现的 IP/主机名
    port: 9000
    reflection: false        # grpc reflection
    health: true             # 注册 grpc.health.v1 健康检查
    registry: cache          # 注册驱动：cache / etcd / nop
    registry_ttl: 30         # 实例失联判定秒数（心跳每 ttl/3 续期）
    registry_service: ""     # 注册的服务名，空则取 app.name
    registry_prefix: grpc:registry
  registry:
  # cache 驱动使用 cache 服务的默认 store（file/memory/redis 通吃），无需额外配置
  # etcd 驱动配置：
  # etcd_endpoints: ["127.0.0.1:2379"]
  # etcd_dial_timeout: 5s
  client:
    watch_interval: 1s       # 实例变更轮询间隔（cache 驱动下生效）
    default:                 # 具名连接，client.Conn()/Conn("default") 使用
      address: "127.0.0.1:9000"   # 直连（与 target 二选一）
      # target: "registry://user"  # 经注册发现（registry://<服务名>）
      insecure: true
      # cert_file: ""  key_file: ""  ca_file: ""   # TLS 三件套（insecure=false 时必填）



# ── Fyne 桌面 GUI ───────────────────────────────
# 由 gofast-fyne 驱动提供（延迟加载，CLI 场景不初始化）。
# 菜单/托盘项：event 点击后向框架事件总线派发同名事件；
#              action 执行内置动作（show / hide / toggle / quit）。
fyne:
  app_id: com.gofast.example
  window:
    title: GoFast 桌面示例
    width: 900
    height: 640
    fixed: false
    close: quit              # quit（关闭即退出）| hide（关闭仅隐藏，需配合托盘）
  menu:
    - label: 应用
      items:
        - label: 刷新用户列表
          event: window.users.refresh
        - separator: true
        - label: 关于
          event: app.about
        - label: 退出
          action: quit
  tray:
    enabled: false            # 桌面环境可开启；icon 相对应用根目录
    # icon: resources/icon.png
    # menu:
    #   - label: 显示主窗口
    #     action: show
    #   - label: 退出
    #     action: quit
